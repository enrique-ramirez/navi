<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vitals</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#faf9f7;--fg:#1a1a1a;--dim:#6b6b6b;--card:#fff;--line:#e4e2de;--accent:#2f6f4f;--warn:#8a4b2a;--bad:#a33a2e}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--fg:#e8e6e3;--dim:#9a9895;--card:#1e1e1e;--line:#2e2e2e;--accent:#7fc4a0;--warn:#d99b6c;--bad:#e08b7f}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:40px 22px 70px}
h1{font-size:26px;margin:0 0 2px;letter-spacing:-.01em;overflow-wrap:anywhere}
h1 .label{color:var(--dim);font-weight:400}
h1 .label:not(:empty)::before{content:"- "}
.links{display:flex;flex-wrap:wrap;gap:6px 16px;margin:6px 0 30px;font-size:13.5px}
.links a{color:var(--accent);text-decoration:none}
.links a:hover{text-decoration:underline}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin:34px 0 12px;font-weight:600;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:10px}
.stat{min-width:0;padding:11px 13px;background:var(--card);border:1px solid var(--line);border-radius:9px}
.stat .k{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.stat .v{display:block;font-size:19px;font-weight:600;letter-spacing:-.015em;line-height:1.1;overflow-wrap:anywhere}
.stat .v i{font-size:12.5px;font-weight:400;font-style:normal;color:var(--dim);margin-left:3px}
.stat .n{display:block;color:var(--dim);font-size:12px;margin-top:4px;line-height:1.35;white-space:pre-line;overflow-wrap:anywhere}
.stat.warn{border-left:3px solid var(--warn);border-radius:0 8px 8px 0}
.stat.warn .n{color:var(--warn)}
.stat.bad{border-left:3px solid var(--bad);border-radius:0 8px 8px 0}
.stat.bad .n{color:var(--bad)}
.meter{display:block;height:3px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.meter b{display:block;height:100%;background:var(--accent);border-radius:2px}
.stat.warn .meter b{background:var(--warn)}
.stat.bad .meter b{background:var(--bad)}
.stale{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:0 8px 8px 0;padding:11px 15px;font-size:13px;margin:0 0 10px}
.stale b{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--line);padding:1.5px 5px;border-radius:4px}
button.stat{font:inherit;color:inherit;text-align:left;width:100%;margin:0;cursor:pointer}
button.stat:hover,.stat.sel{border-color:var(--accent)}
/* Keep the status stripe on hover and selection: it's the tile's warning, and
   the accent border mustn't paint over it. */
.stat.warn:hover,.stat.warn.sel{border-left-color:var(--warn)}
.stat.bad:hover,.stat.bad.sel{border-left-color:var(--bad)}
button.stat:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.stat.sel{box-shadow:inset 0 0 0 1px var(--accent)}
/* Service sections: the log and the restart control under their tiles. */
.logbox{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 13px}
.logsw{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:8px}
.logsw button{font:inherit;font-size:12.5px;padding:3px 11px;border:0;background:none;color:var(--dim);cursor:pointer}
.logsw button[aria-pressed=true]{background:var(--line);color:var(--fg);font-weight:600}
.log{max-height:22em;overflow-y:auto}
.log:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ll{font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;padding:3px 0;border-bottom:1px solid var(--line)}
.ll:last-child{border-bottom:0}
.log p{font-size:13px;margin:4px 0;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px}
.actions:empty{display:none}
button.restart{font:inherit;font-size:13px;padding:5px 14px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--fg);cursor:pointer}
button.restart:hover{border-color:var(--accent)}
button.restart:disabled{color:var(--dim);cursor:default}
.rstatus{font-size:12.5px;color:var(--dim);overflow-wrap:anywhere}
.rstatus.bad{color:var(--bad)}
dialog{max-width:min(92vw,420px);padding:18px 20px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font-size:14px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{font-size:16px;margin:0 0 8px;overflow-wrap:anywhere}
dialog p{margin:0 0 14px;overflow-wrap:anywhere}
dialog .dbtn{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
dialog button{font:inherit;font-size:13px;padding:5px 14px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--fg);cursor:pointer}
dialog button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
dialog button.go{border-color:var(--bad);color:var(--bad)}
/* Chart series. Validated as a categorical pair on each mode's card surface. */
:root{--s1:#2a78d6;--s2:#eb6834}
@media(prefers-color-scheme:dark){:root{--s1:#3987e5;--s2:#d95926}}
#hist{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:13px 15px}
.hhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hhead b{font-size:14.5px;margin-right:auto;overflow-wrap:anywhere}
.range{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.range button{font:inherit;font-size:12.5px;padding:3px 11px;border:0;background:none;color:var(--dim);cursor:pointer}
.range button[aria-pressed=true]{background:var(--line);color:var(--fg);font-weight:600}
.hx{font:inherit;font-size:20px;line-height:1;border:0;background:none;color:var(--dim);cursor:pointer;padding:0 4px}
.hx:hover{color:var(--fg)}
.hsum{font-size:13.5px;margin:9px 0 0}
.hsum span{color:var(--dim)}
.hlegend{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:12px;color:var(--dim);margin:6px 0 2px}
.hlegend:empty{display:none}
.hlegend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin:-1px 5px 0 0;border-radius:1px}
.hlegend i.box{width:9px;height:9px;border-radius:2px}
.hchart{position:relative;margin-top:6px;transition:opacity .15s}
.hchart.busy{opacity:.5}
.hchart:empty{display:none}
.hchart svg{display:block;width:100%;overflow:visible;touch-action:pan-y}
.hchart svg:focus{outline:none}
.hchart svg:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.hchart text{font:11px ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--dim);font-variant-numeric:tabular-nums}
.htip{position:absolute;top:4px;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12px;line-height:1.5;white-space:nowrap;box-shadow:0 3px 12px rgba(0,0,0,.14);z-index:2}
.htip .tt{color:var(--dim)}
.htip i{display:inline-block;width:10px;height:2px;vertical-align:middle;margin:-1px 6px 0 0}
.htip b{font-weight:600;margin-right:4px}
.htip span{color:var(--dim)}
#hlist table{margin-top:10px;font-variant-numeric:tabular-nums}
#hlist td:first-child{white-space:nowrap;width:1%;padding-right:22px}
#hlist details summary{cursor:pointer;font-size:12.5px;color:var(--dim);margin-top:10px}
#hlist .loghead{font-size:12.5px;color:var(--dim);margin:14px 0 4px}
.hfoot{font-size:12px;color:var(--dim);margin:8px 0 0}
.hfoot.bad{color:var(--bad)}
.how{font-size:12px;color:var(--dim);margin:10px 0 0}
</style></head><body><div class="wrap">

<h1><span id="hname">vitals</span> <span id="hlabel" class="label"></span></h1>
<p class="links"><a href="http://help.lan">help.lan</a><a href="http://agitha.lan">agitha.lan</a><a href="https://music.lan">music.lan</a></p>

<div id="vitals" hidden>
<div id="stale"></div>

<section id="box">
<h2>This box</h2>
<div id="boxgrid" class="stats"></div>
<div id="hist" hidden>
  <div class="hhead">
    <b id="htitle"></b>
    <span class="range" role="group" aria-label="Time range">
      <button type="button" data-r="day">24h</button><button type="button" data-r="week">7d</button><button type="button" data-r="quarter">90d</button>
    </span>
    <button type="button" class="hx" aria-label="Close history">&times;</button>
  </div>
  <div id="hsum" class="hsum"></div>
  <div id="hlegend" class="hlegend"></div>
  <div id="hchart" class="hchart"></div>
  <div id="hlist"></div>
  <p id="hfoot" class="hfoot"></p>
</div>
</section>

<div id="svcs"></div>

<p class="how">
Sampled every 28s by <code>host-status.timer</code>, re-read every 30s and
whenever this tab regains focus. Tap a tile for its last 24 hours, 7 or 90
days. This is a view, not an alarm, <code>status.lan</code> is what wakes you.
</p>
</div>

</div>

<dialog id="rdlg" aria-labelledby="rtitle" aria-describedby="rbody">
  <h3 id="rtitle"></h3>
  <p id="rbody"></p>
  <div class="dbtn"><button type="button" id="rcancel">Cancel</button><button type="button" id="rgo" class="go">Restart</button></div>
</dialog>

<script>
// Renders host.json and the logs beside it, and the history behind each tile.
// Everything named here (services, units, timers, thresholds) comes from
// host.json; nothing on this page knows which box it is looking at.
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var vitals = $('vitals'), boxgrid = $('boxgrid'), svcs = $('svcs'), stale = $('stale'),
      hist = $('hist'), title = $('htitle'), sum = $('hsum'), legend = $('hlegend'),
      chart = $('hchart'), list = $('hlist'), foot = $('hfoot'), SVG = 'http://www.w3.org/2000/svg';

  var D = null;            // the latest host.json
  var TH = {};             // its thresholds
  var open = null;         // the tile whose history is showing
  var secs = {}, builtFor = null;

  var esc = function (t) {
    var d = document.createElement('div'); d.textContent = t == null ? '' : t;
    return d.innerHTML.replace(/"/g, '&quot;');
  };
  function h(tag, text, cls) {
    var e = document.createElement(tag);
    if (text != null) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }
  function dur(s) {
    var d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    if (d) return d + 'd ' + hh + 'h';
    if (hh) return hh + 'h ' + m + 'm';
    return m + 'm';
  }
  function gb(kb) { var v = kb / 1048576; return v >= 100 ? v.toFixed(0) : v.toFixed(1); }
  function mbit(b) { return b == null ? null : b * 8 / 1e6; }   // counters are bytes, links are quoted in bits
  function mbitText(bytes) {
    var v = mbit(bytes);
    return v >= 10 ? v.toFixed(0) : v.toFixed(v >= 1 ? 1 : 2);
  }
  function size(b) {
    return b >= 1073741824 ? (b / 1073741824).toFixed(1) + ' GB'
      : b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.round(b / 1024) + ' KB';
  }
  function pc(v) { return v >= 10 ? v.toFixed(0) : v.toFixed(1); }
  function pick(v, warn, bad) { return v >= bad ? 'bad' : v >= warn ? 'warn' : ''; }
  function worse(a, b) { return a === 'bad' || b === 'bad' ? 'bad' : a || b; }
  function ago(iso) { return dur(Math.max(0, (Date.now() - Date.parse(iso)) / 1000)); }
  function logTime(t) {
    return t == null ? '\u2014' : new Date(t * 1000).toLocaleString(undefined,
      { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  // label, value, unit, note, class, optional 0-100 meter, optional history key.
  // A tile with a history is a button, and its accessible name starts with its
  // label because the label is the first thing inside it.
  function tile(k, v, u, n, cls, pct, hk) {
    var sel = hk && open === hk, tag = hk ? 'button' : 'div';
    return '<' + tag + ' class="stat ' + (cls || '') + (sel ? ' sel' : '') + '"' +
      (hk ? ' type="button" data-h="' + esc(hk) + '" aria-expanded="' + !!sel + '" aria-controls="hist"' : '') + '>' +
      '<span class="k">' + esc(k) + '</span>' +
      '<span class="v">' + esc(v) + (u ? '<i>' + esc(u) + '</i>' : '') + '</span>' +
      (pct == null ? '' : '<span class="meter"><b style="width:' + Math.max(1, Math.min(100, pct)) + '%"></b></span>') +
      '<span class="n">' + esc(n) + '</span></' + tag + '>';
  }

  function boxTiles(d) {
    var t = [], T = TH;

    // Temperature. A missing reading is never drawn as 0.
    var noTemp = d.temp_c == null;
    t.push(tile('Temperature', noTemp ? '\u2014' : (+d.temp_c).toFixed(1), noTemp ? '' : '\u00b0C',
      noTemp ? 'sensor unreadable'
        : d.throttles == null ? 'throttle count unavailable'
        : d.throttles + (d.throttles === 1 ? ' throttling event' : ' throttling events') + ' since boot',
      noTemp ? '' : pick(d.temp_c, T.TEMP_WARN, T.TEMP_BAD), null, 'temp'));

    var cpu = +d.cpu_pct || 0, load = (d.load || []).map(function (x) { return (+x).toFixed(2); });
    t.push(tile('CPU', pc(cpu), '%',
      'busiest core ' + Math.round(+d.cpu_core_max_pct || 0) + '% \u00b7 load ' + load.join(' / '),
      pick(cpu, T.CPU_WARN, T.CPU_BAD), cpu, 'cpu'));

    var mUsed = d.mem_total_kb - d.mem_avail_kb, mPct = Math.round(mUsed / d.mem_total_kb * 100);
    t.push(tile('Memory', gb(mUsed) + ' / ' + gb(d.mem_total_kb), 'GB',
      mPct + '% used', pick(mPct, T.MEM_WARN, T.MEM_BAD), mPct, 'mem'));

    var mu = d.music, dcls = pick(d.disk_pct, T.DISK_WARN, T.DISK_BAD);
    if (mu) dcls = worse(dcls, pick(mu.pct, T.DISK_WARN, T.DISK_BAD));
    t.push(tile('Disk', gb(d.disk_used_kb) + ' / ' + gb(d.disk_total_kb), 'GB',
      d.disk_pct + '% used' + (mu ? '\nmusic ' + gb(mu.used_kb) + ' / ' + gb(mu.total_kb) + ' GB \u00b7 ' + mu.pct + '% used' : ''),
      dcls, d.disk_pct, 'disk'));

    var n = d.net || {}, linkBad = n.state !== 'up', linkSlow = n.link_mbit != null && n.link_mbit < 1000;
    t.push(tile('Network', '\u2193' + mbitText(n.rx_bps || 0) + '  \u2191' + mbitText(n.tx_bps || 0), 'Mb/s',
      linkBad ? n.iface + ' is ' + n.state
        : linkSlow ? n.iface + ' negotiated ' + n.link_mbit + ' Mb/s, not 1000'
        : n.iface + ' \u00b7 ' + (n.link_mbit || '?') + ' Mb/s link',
      linkBad ? 'bad' : linkSlow ? 'warn' : '', null, 'net'));

    t.push(tile('Uptime', dur(d.uptime_s), '',
      d.uptime_s < 3600 ? 'rebooted within the hour'
        : 'since ' + new Date(d.booted).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }),
      d.uptime_s < 3600 ? 'warn' : '', null, 'uptime'));

    var un = d.units || [],
        down = un.filter(function (u) { return u.state !== 'active'; }),
        rs = un.filter(function (u) { return u.restarts > 0; });
    t.push(tile('Services', (un.length - down.length) + ' / ' + un.length, 'active',
      down.length ? down.map(function (u) { return u.name + ' ' + u.state; }).join(', ')
        : rs.length ? rs.map(function (u) { return u.name + ' restarted ' + u.restarts + '\u00d7'; }).join(', ')
        : 'all active',
      down.length ? 'bad' : rs.length ? 'warn' : '', null, 'services'));

    var tm = d.timers || [],
        badT = tm.filter(function (u) { return u.timer !== 'active' || (u.result && u.result !== 'success'); });
    t.push(tile('Timers', (tm.length - badT.length) + ' / ' + tm.length, 'ok',
      badT.length ? badT.map(function (u) { return u.name + ': ' + (u.timer !== 'active' ? u.timer : u.result); }).join(', ')
        : 'all firing',
      badT.length ? 'bad' : '', null, 'timers'));

    // Not a security tile so much as a memory aid. No count of rejected
    // attempts: this box does not sample one.
    var sh = d.ssh || {}, shn = [];
    if (sh.last_user) shn.push(sh.last_user + (sh.last_from ? ' from ' + sh.last_from : ''));
    t.push(tile('SSH',
      sh.sessions > 0 ? sh.sessions + (sh.sessions > 1 ? ' sessions' : ' session')
        : sh.last_at ? ago(sh.last_at) : 'no record',
      sh.sessions > 0 ? 'open now' : sh.last_at ? 'ago' : '',
      shn.join('  \u00b7  ') || 'no logins recorded', '', null, 'ssh'));

    var er = d.errors || {};
    t.push(tile('Errors', er.count_24h == null ? '\u2014' : er.count_24h, 'in 24h',
      er.last_at ? 'last ' + ago(er.last_at) + ' ago' : 'none in 24 h', '', null, 'errors'));

    var b = d.backup || {}, age = b.age_min;
    t.push(tile('Last backup', age == null ? 'never' : dur(age * 60), age == null ? '' : 'ago',
      age == null ? 'no backup found' : b.count + ' kept \u00b7 ' + size(b.size),
      age == null ? 'bad' : pick(age / 60, T.BACKUP_WARN_H, T.BACKUP_BAD_H)));
    return t;
  }

  // No per-service thresholds exist, so only State and Writes colour.
  function svcTiles(s) {
    var t = [], k = s.name, ex = s.extra || {}, on = s.state === 'active', hasCpu = on && s.cpu_pct != null;
    t.push(tile('CPU', hasCpu ? pc(+s.cpu_pct) : '\u2014', hasCpu ? '%' : '',
      on ? 'of one core' : '', '', null, k + ':cpu'));
    var mem = on && s.mem_bytes != null;
    t.push(tile('Memory', mem ? Math.round(s.mem_bytes / 1048576) : '\u2014', mem ? 'MB' : '',
      mem && s.mem_peak_bytes != null ? 'peak ' + Math.round(s.mem_peak_bytes / 1048576) + ' MB' : '', '', null, k + ':mem'));
    var rn = (s.restarts || 0) + (s.restarts === 1 ? ' restart' : ' restarts'),
        last = s.result && s.result !== 'success' ? ' \u00b7 last stop: ' + s.result : '';
    t.push(tile('State', on ? 'active' : s.state, on && s.since ? 'for ' + ago(s.since) : '',
      rn + last, on ? '' : 'bad', null, k + ':state'));
    if (ex.writes_24h != null) {
      var f = ex.failed_24h || 0;
      t.push(tile('Writes', ex.writes_24h, '',
        f + ' failed \u00b7 ' + (ex.last_at ? 'last ' + ago(ex.last_at) + ' ago' : 'none yet'),
        f > 0 && f >= TH.FAILED_WARN ? 'warn' : '', null, k + ':writes'));
    }
    if ('unplayable' in ex) {
      var unreadable = ex.unplayable == null;
      t.push(tile('Unplayable', unreadable ? '\u2014' : ex.unplayable, '', unreadable ? 'log unreadable' : 'distinct files in its error log', '', null, k + ':unplayable'));
    }
    return t;
  }

  function buildSection(s, i) {
    var sec = h('section', null, 'svc'), hd = h('h2', s.name), stats = h('div', null, 'stats'),
        box = h('div', null, 'logbox'), sw = h('div', null, 'logsw'), log = h('div', null, 'log'),
        act = h('div', null, 'actions');
    hd.id = 'svc' + i;
    sec.setAttribute('aria-labelledby', hd.id);
    sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', s.name + ' log view');
    ['all', 'writes'].forEach(function (m) {
      var b = h('button', m === 'all' ? 'All' : 'Writes'); b.type = 'button'; b.setAttribute('data-m', m);
      sw.appendChild(b);
    });
    log.tabIndex = 0; log.setAttribute('role', 'log'); log.setAttribute('aria-label', s.name + ' log');
    box.appendChild(sw); box.appendChild(log);
    sec.appendChild(hd); sec.appendChild(stats); sec.appendChild(box); sec.appendChild(act);
    svcs.appendChild(sec);
    var o = { name: s.name, svc: s, stats: stats, sw: sw, log: log, act: act, mode: 'all', data: null, token: 0, btn: null,
              status: h('span', null, 'rstatus') };
    o.status.setAttribute('role', 'status');
    sw.addEventListener('click', function (e) {
      var b = e.target.closest('[data-m]');
      if (!b) return;
      o.mode = b.getAttribute('data-m'); paintLog(o);
    });
    secs[s.name] = o;
    return o;
  }

  function syncSections(services) {
    var names = services.map(function (s) { return s.name; }).join(' ');
    if (names !== builtFor) {
      // The history panel can be sitting inside a section about to go.
      show(null);
      boxgrid.parentNode.insertBefore(hist, boxgrid.nextSibling);
      svcs.textContent = ''; secs = {};
      services.forEach(buildSection);
      builtFor = names;
    }
    services.forEach(function (s) {
      var o = secs[s.name];
      o.svc = s;
      o.stats.innerHTML = svcTiles(s).join('');
      // The Restart button is created once and kept, so the handler and the
      // restart state attached to it survive the 30-second rebuilds.
      if (s.restartable && !o.btn) {
        var b = h('button', 'Restart', 'restart');

        y = function (v) { return T + ph - (v - lo) / (hi - lo) * ph; };

    var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, tabindex: 0, role: 'img',
      'aria-label': m.title + ', ' + RANGES[range] + '. ' + sum.textContent });

    // Outages first, so the data draws over them.
    downs.forEach(function (o) {
      var a = x(Math.max(o[0], t0)), b = x(Math.min(o[1], t1));
      svg.appendChild(el('rect', { x: a, y: T, width: Math.max(2, b - a), height: ph,
        fill: o[2] === 'down' ? 'var(--bad)' : 'var(--dim)', 'fill-opacity': .16 }));
    });

    ticks.forEach(function (v) {
      svg.appendChild(el('line', { x1: L, x2: L + pw, y1: y(v), y2: y(v), stroke: 'var(--line)', 'stroke-width': 1 }));
      svg.appendChild(el('text', { x: L - 6, y: y(v) + 3.5, 'text-anchor': 'end' }, num(v, v % 1 ? 1 : 0)));
    });
    timeTicks(t0, t1, pw).forEach(function (tk) {
      svg.appendChild(el('text', { x: x(tk[0]), y: H - 5, 'text-anchor': 'middle' }, tk[1]));
    });

    rf.forEach(function (r) {
      if (r.v <= lo || r.v > hi) return;
      svg.appendChild(el('line', { x1: L, x2: L + pw, y1: y(r.v), y2: y(r.v), stroke: 'var(--' + r.c + ')', 'stroke-width': 1, 'stroke-opacity': .7 }));
      svg.appendChild(el('text', { x: L + pw, y: y(r.v) - 4, 'text-anchor': 'end' }, r.t));
    });

    if (hasThr) d.throttled.forEach(function (on, i) {
      if (on) svg.appendChild(el('rect', { x: x(d.t[i]), y: T + ph - 4, width: Math.max(2, d.bucket / (t1 - t0) * pw), height: 4, fill: 'var(--bad)', rx: 1 }));
    });

    // A line breaks wherever samples stopped. Drawing straight across a gap
    // would invent readings for a stretch when nothing was measured.
    var gap = Math.max(d.bucket * 2.5, 150);
    function runs(v) {
      var out = [], r = null;
      for (var i = 0; i < n; i++) {
        if (v[i] == null || (r && d.t[i] - d.t[i - 1] > gap)) { r = null; if (v[i] == null) continue; }
        if (!r) out.push(r = []);
        r.push(i);
      }
      return out;
    }
    var centre = function (i) { return d.t[i] + (d.bucket > 1 ? d.bucket / 2 : 0); },
        px = function (i) { return x(centre(i)).toFixed(1); };
    function path(v) {
      return runs(v).map(function (r) {
        return r.map(function (i, j) {
          var py = y(v[i]).toFixed(1);
          return j ? 'L' + px(i) + ' ' + py : 'M' + px(i) + ' ' + py;
        }).join('');
      }).join('');
    }
    // The spread up to each bucket's peak is a wash rather than a second line.
    // A peak line over 90 days of bursty traffic is a solid block of ink; a
    // wash stays readable and still shows where the spikes were.
    function band(a, p) {
      return runs(a).map(function (r) {
        var up = r.map(function (i, j) { return (j ? 'L' : 'M') + px(i) + ' ' + y(p[i] == null ? a[i] : p[i]).toFixed(1); }),
            back = r.slice().reverse().map(function (i) { return 'L' + px(i) + ' ' + y(a[i]).toFixed(1); });
        return up.join('') + back.join('') + 'Z';
      }).join('');
    }
    if (m.sum) {
      var bw = Math.max(2, d.bucket / (t1 - t0) * pw - 1);
      m.lines.forEach(function (ln) {
        vals(d, m, ln.k).forEach(function (v, i) {
          if (v == null || v <= 0) return;
          var bx = x(d.t[i]);
          svg.appendChild(el('rect', { x: bx.toFixed(1), y: y(v).toFixed(1), width: Math.min(bw, L + pw - bx).toFixed(1),
            height: Math.max(1, y(lo) - y(v)).toFixed(1), fill: 'var(--' + ln.c + ')', 'fill-opacity': .85 }));
        });
      });
    } else {
      m.lines.forEach(function (ln) {
        if (peaks && ln.pk) svg.appendChild(el('path', { d: band(vals(d, m, ln.k), vals(d, m, ln.pk)),
          fill: 'var(--' + ln.c + ')', 'fill-opacity': .22, stroke: 'none' }));
      });
      m.lines.forEach(function (ln) {
        var at = { d: path(vals(d, m, ln.k)), fill: 'none', stroke: 'var(--' + ln.c + ')',
          'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };
        if (ln.dash) at['stroke-dasharray'] = '6 4';
        svg.appendChild(el('path', at));
      });
    }

    // Hover layer: a crosshair that snaps to the nearest bucket, and one
    // tooltip listing every series there.
    var hair = el('line', { y1: T, y2: T + ph, stroke: 'var(--dim)', 'stroke-width': 1, visibility: 'hidden' });
    svg.appendChild(hair);
    var dots = m.lines.map(function (ln) {
      var c = el('circle', { r: 4, fill: 'var(--' + ln.c + ')', stroke: 'var(--card)', 'stroke-width': 2, visibility: 'hidden' });
      svg.appendChild(c); return c;
    });
    var hit = el('rect', { x: L, y: 0, width: pw, height: H, fill: 'transparent' });
    svg.appendChild(hit);

    var tip = h('div', null, 'htip'); tip.hidden = true;
    var cur = -1;

    function nearest(t) {
      var a = 0, b = n - 1;
      while (b - a > 1) { var mid = (a + b) >> 1; if (d.t[mid] <= t) a = mid; else b = mid; }
      return Math.abs(d.t[a] - t) <= Math.abs(d.t[b] - t) ? a : b;
    }
    function point(i, tAt) {
      cur = i;
      var mid = centre(i), pxx = x(mid),
          outage = null;
      d.down.forEach(function (o) { if (tAt >= o[0] && tAt <= o[1]) outage = o; });
      var far = Math.abs(tAt - mid) > gap;
      tip.textContent = '';
      if (outage || far) {
        hair.setAttribute('visibility', 'hidden');
        dots.forEach(function (c) { c.setAttribute('visibility', 'hidden'); });
        tip.appendChild(h('div', stamp(tAt), 'tt'));
        tip.appendChild(h('div', outage
          ? (outage[2] === 'down' ? 'host down for ' : 'not sampled for ') + durS(outage[1] - outage[0])
          : 'no samples'));
        pxx = x(tAt);
      } else {
        hair.setAttribute('x1', pxx); hair.setAttribute('x2', pxx); hair.setAttribute('visibility', 'visible');
        tip.appendChild(h('div', span(d.t[i], d.bucket), 'tt'));
        m.lines.forEach(function (ln, li) {
          var v = vals(d, m, ln.k)[i], row = h('div');
          if (v == null) { dots[li].setAttribute('visibility', 'hidden'); }
          else {
            dots[li].setAttribute('cx', pxx); dots[li].setAttribute('cy', y(v)); dots[li].setAttribute('visibility', 'visible');
          }
          row.appendChild(swatch('var(--' + ln.c + ')'));
          row.appendChild(h('b', withUnit(v, m)));
          var note = ln.name;
          if (peaks && ln.pk) note += ', peak ' + withUnit(vals(d, m, ln.pk)[i], m);
          row.appendChild(h('span', note));
          tip.appendChild(row);
        });
        if (open === 'temp' && d.throttled[i]) tip.appendChild(h('div', 'throttling in this ' + (d.bucket > 1 ? 'bucket' : 'sample')));
      }
      tip.hidden = false;
      var tw = tip.offsetWidth;
      tip.style.left = (pxx + 12 + tw > W ? Math.max(0, pxx - 12 - tw) : pxx + 12) + 'px';
    }
    function leave() {
      tip.hidden = true; hair.setAttribute('visibility', 'hidden');
      dots.forEach(function (c) { c.setAttribute('visibility', 'hidden'); });
    }
    svg.addEventListener('pointermove', function (e) {
      var r = svg.getBoundingClientRect(), pxx = (e.clientX - r.left) * W / r.width;
      if (pxx < L || pxx > L + pw) return leave();
      var t = t0 + (pxx - L) / pw * (t1 - t0);
      point(nearest(t), t);
    });
    svg.addEventListener('pointerleave', leave);
    svg.addEventListener('blur', leave);
    svg.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      var i = cur < 0 ? n - 1 : Math.max(0, Math.min(n - 1, cur + (e.key === 'ArrowLeft' ? -1 : 1)));
      point(i, centre(i));
    });

    chart.textContent = '';
    chart.appendChild(svg);
    chart.appendChild(tip);

    peakTable(d, m);
  }

  function legendBox(color, opacity, text) {
    var s = h('span'), i = swatch(color, true);
    i.style.opacity = opacity;
    s.appendChild(i); s.appendChild(document.createTextNode(text));
    legend.appendChild(s);
  }

  // The highest readings as a table: the chart's numbers without hovering, and
  // usually the question that opened it. Peaks closer together than a few
  // buckets are one event, so only the highest of each cluster is listed.
  function peakTable(d, m) {
    if (m.trend || m.sum) return;
    var ln = m.lines[0], p = ln.pk ? vals(d, m, ln.pk) : vals(d, m, ln.k), a = vals(d, m, ln.k),
        idx = [], sep = Math.max(d.bucket * 6, 1800);
    for (var i = 0; i < p.length; i++) if (p[i] != null) idx.push(i);
    idx.sort(function (u, v) { return p[v] - p[u]; });
    var picked = [];
    idx.some(function (i) {
      if (picked.every(function (j) { return Math.abs(d.t[i] - d.t[j]) >= sep; })) picked.push(i);
      return picked.length >= 5;
    });
    if (!picked.length) return;
    var det = h('details'), tb = h('table'), tr = h('tr');
    det.appendChild(h('summary', 'Highest readings' + (m.lines.length > 1 ? ', ' + ln.name : '')));
    tr.appendChild(h('th', 'When')); tr.appendChild(h('th', 'Peak'));
    if (d.bucket > 1 && ln.pk) tr.appendChild(h('th', 'Average'));
    tb.appendChild(tr);
    picked.forEach(function (i) {
      tr = h('tr');
      tr.appendChild(h('td', span(d.t[i], d.bucket)));
      tr.appendChild(h('td', withUnit(p[i], m)));
      if (d.bucket > 1 && ln.pk) tr.appendChild(h('td', withUnit(a[i], m)));
      tb.appendChild(tr);
    });
    det.appendChild(tb);
    list.appendChild(det);
  }

  function drawDowntime(d) {
    var from = coverage(d), to = d.generated, total = Math.max(1, to - from),
        downs = d.down.filter(function (o) { return o[1] > from; }),
        down = 0, blind = 0, outages = 0;
    downs.forEach(function (o) {
      var s = Math.min(o[1], to) - Math.max(o[0], from);
      if (o[2] === 'down') { down += s; outages++; } else blind += s;
    });

    sum.appendChild(h('b', 'Up ' + (100 * (1 - down / total)).toFixed(down ? 2 : 0) + '%'));
    sum.appendChild(h('span', ' since ' + stamp(from) + ' \u00b7 ' +
      (outages ? outages + (outages > 1 ? ' outages, ' : ' outage, ') + durS(down) + ' down' : 'no outages') +
      (blind ? ' \u00b7 ' + durS(blind) + ' not sampled' : '')));

    legendBox('var(--accent)', '.45', 'up');
    if (outages) legendBox('var(--bad)', '1', 'host down');
    if (blind) legendBox('var(--dim)', '.55', 'up, not sampled');

    var W = Math.max(280, chart.clientWidth || hist.clientWidth - 30), H = 52, L = 0, pw = W,
        t0 = from, t1 = d.generated,
        x = function (t) { return L + (t - t0) / (t1 - t0) * pw; };
    var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'img',
      'aria-label': 'Uptime, ' + RANGES[range] + '. ' + sum.textContent });
    svg.appendChild(el('rect', { x: x(from), y: 6, width: Math.max(0, x(to) - x(from)), height: 20, rx: 4, fill: 'var(--accent)', 'fill-opacity': .45 }));
    downs.forEach(function (o) {
      var a = x(Math.max(o[0], from)), b = x(Math.min(o[1], to));
      svg.appendChild(el('rect', { x: a, y: 6, width: Math.max(3, b - a), height: 20,
        fill: o[2] === 'down' ? 'var(--bad)' : 'var(--dim)', 'fill-opacity': o[2] === 'down' ? 1 : .55 }));
    });
    timeTicks(t0, t1, pw).forEach(function (tk) {
      var tx = x(tk[0]);
      if (tx < 14 || tx > W - 14) return;
      svg.appendChild(el('text', { x: tx, y: H - 6, 'text-anchor': 'middle' }, tk[1]));
    });
    chart.textContent = '';
    chart.appendChild(svg);

    if (!downs.length) return;
    var tb = h('table'), tr = h('tr');
    ['When', 'For', 'What'].forEach(function (s) { tr.appendChild(h('th', s)); });
    tb.appendChild(tr);
    downs.slice().reverse().forEach(function (o) {
      tr = h('tr');
      tr.appendChild(h('td', stamp(o[0])));
      tr.appendChild(h('td', durS(o[1] - o[0])));
      tr.appendChild(h('td', o[2] === 'down'
        ? 'the host was down, then booted'
        : 'the host was up, but host-status.timer took no samples'));
      tb.appendChild(tr);
    });
    list.appendChild(tb);
  }

  function describe(e) {
    var kind = e[1], who = e[2], det = String(e[3]), ft = det.split('>');
    if (kind === 'restart') return who + ' restarted' + (+det > 1 ? ' ' + det + '\u00d7' : '');
    if (kind === 'state') return who + ' ' + ft[0] + ' \u2192 ' + ft[1];
    if (kind === 'timer') return who + '.timer ' + ft[0] + ' \u2192 ' + ft[1];
    if (ft[1] === 'success') return who + ' succeeded again (was ' + ft[0] + ')';
    return who + ' run ' + ft[1] + (ft[0] !== 'success' ? ' (was ' + ft[0] + ')' : '');
  }
  function isBad(e) {
    var to = String(e[3]).split('>')[1];
    return e[1] === 'restart' || (e[1] === 'state' && to !== 'active') ||
      (e[1] === 'timer' && to !== 'active') || (e[1] === 'result' && to !== 'success');
  }

  function drawEvents(d, m) {
    chart.textContent = '';
    var ev = d.events.filter(function (e) {
          return m.kinds[e[1]] && e[0] >= d.since && (!m.who || m.who.indexOf(e[2]) >= 0);
        }),
        from = coverage(d), nbad = ev.filter(isBad).length;
    if (!ev.length) {
      sum.appendChild(h('b', m.none));
      sum.appendChild(h('span', ' since ' + stamp(from) + '.'));
      return;
    }
    sum.appendChild(h('b', nbad + (nbad === 1 ? ' problem' : ' problems')));
    sum.appendChild(h('span', ' since ' + stamp(from) + ' \u00b7 ' + ev.length + (ev.length === 1 ? ' change' : ' changes') + ' in all'));
    var tb = h('table'), tr = h('tr');
    tr.appendChild(h('th', 'When')); tr.appendChild(h('th', 'What'));
    tb.appendChild(tr);
    ev.slice().reverse().forEach(function (e) {
      tr = h('tr');
      tr.appendChild(h('td', stamp(e[0])));
      var td = h('td', describe(e));
      if (isBad(e)) td.style.color = 'var(--bad)';
      tr.appendChild(td);
      tb.appendChild(tr);
    });
    list.appendChild(tb);
    if (d.events.length >= 300) list.appendChild(h('p', 'Showing the most recent 300 changes.', 'hfoot'));
  }

  function nice(lo, hi, count) {
    if (hi - lo < 1e-9) { hi = lo + 1; }
    var raw = (hi - lo) / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag,
        step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag,
        a = Math.floor(lo / step + 1e-9) * step, out = [];
    for (var v = a; v < hi + step - 1e-9; v += step) out.push(+v.toFixed(6));
    if (out.length < 2) out.push(a + step);
    return out;
  }

  function timeTicks(t0, t1, pw) {
    var H = 3600, D = 86400, spanS = t1 - t0, max = Math.max(3, Math.floor(pw / 78)),
        steps = [H, 2 * H, 3 * H, 6 * H, 12 * H, D, 2 * D, 7 * D, 14 * D, 28 * D], step = steps[steps.length - 1];
    for (var i = 0; i < steps.length; i++) if (spanS / steps[i] <= max) { step = steps[i]; break; }
    var dt = new Date(t0 * 1000), out = [];
    if (step < D) {
      var sh = step / H;
      dt.setMinutes(0, 0, 0);
      while (dt.getTime() / 1000 < t0 || dt.getHours() % sh) dt.setHours(dt.getHours() + 1);
      for (; dt.getTime() / 1000 <= t1; dt.setHours(dt.getHours() + sh)) {
        var t = dt.getTime() / 1000;
        out.push([t, dt.getHours() === 0
          ? dt.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric' })
          : dt.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })]);
      }
    } else {
      var sd = step / D;
      dt.setHours(24, 0, 0, 0);
      for (; dt.getTime() / 1000 <= t1; dt.setDate(dt.getDate() + sd)) {
        out.push([dt.getTime() / 1000, dt.toLocaleDateString(undefined,
          sd < 7 ? { weekday: 'short', day: 'numeric' } : { day: 'numeric', month: 'short' })]);
      }
    }
    return out;
  }

  vitals.addEventListener('click', function (e) {
    var b = e.target.closest('[data-h]');
    if (b) show(b.getAttribute('data-h'));
  });
  hist.querySelector('.hx').addEventListener('click', function () {
    var k = open; show(null);
    var b = k && document.querySelector('[data-h="' + k + '"]'); if (b) b.focus();
  });
  hist.querySelector('.range').addEventListener('click', function (e) {
    var b = e.target.closest('[data-r]');
    if (!b) return;
    range = b.getAttribute('data-r');
    try { localStorage.setItem('vitals.range', range); } catch (err) {}
    draw();
  });
  document.addEventListener('keydown', function (e) {
    // A dialog closes itself on Escape and must not close the history behind it.
    if (e.key === 'Escape' && open && !document.querySelector('dialog[open]')) hist.querySelector('.hx').click();
  });
  var raf = 0;
  window.addEventListener('resize', function () {
    if (!open) return;
    cancelAnimationFrame(raf); raf = requestAnimationFrame(draw);
  });
})();
</script>

</body></html>
