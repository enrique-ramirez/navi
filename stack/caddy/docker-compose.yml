# Reverse proxy. Everything on port 80 by name.
#
# network_mode: host so 127.0.0.1:3001 and :8081 reach the other services
# without a shared docker network.
services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - /srv/navi/stack/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/navi/www:/srv/www:ro
      - /srv/data/caddy:/data
      - /srv/data/www:/srv/status:ro
    environment:
      TZ: ${TZ}
      MUSIC_BACKEND: ${MUSIC_BACKEND}
      AGITHA_BACKEND: ${AGITHA_BACKEND}
    mem_limit: 128m
