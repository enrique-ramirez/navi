# vitals config for hyrule-castle, installed as /etc/vitals.conf.
# KEY=value, one a line, read by vitals/config.py and the sampler, never sourced.
# Thresholds not listed here come from vitals/defaults.conf.

HOST=hyrule-castle
LABEL=the services box
UNITS=xvfb openbox foobar2000 agitha host-page
TIMERS=fb2k-backup host-status host-history
BACKUP_GLOB=/srv/backup/fb2k-state-*.tar.gz

SERVICES=foobar2000 agitha
RESTARTABLE=foobar2000 agitha
SERVICE_foobar2000_UNIT=foobar2000.service
SERVICE_foobar2000_LOG=file:/srv/fb2k/foobar2000/profile/console-log
SERVICE_foobar2000_EXTRA=unplayable:/srv/fb2k/foobar2000/profile/library-error-log.txt
SERVICE_agitha_UNIT=agitha.service
SERVICE_agitha_LOG=journal
SERVICE_agitha_EXTRA=writes

TEMP_WARN=80
TEMP_BAD=90
